definitions:
  handlers.AssignUserSubscriptionRequest:
    properties:
      duration_months:
        type: integer
      subscription_plan_id:
        type: integer
      user_id:
        type: integer
    type: object
  handlers.CancelRequest:
    properties:
      reason:
        type: string
    type: object
  handlers.CreateAdminRequest:
