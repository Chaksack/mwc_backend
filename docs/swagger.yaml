    - audience
    - description
    - end_date
    - event_type
    - start_date
    - title
    type: object
  handlers.CreateReviewRequest:
    properties:
      comment:
        maxLength: 1000
        minLength: 10
        type: string
      rating:
        maximum: 5
        minimum: 1
        type: integer
      school_id:
        type: integer
    required:
    - comment
    - rating
    - school_id
    type: object
  handlers.CreateSubscriptionPlanRequest:
    properties:
      allowed_roles:
        items:
          type: string
        type: array
      billing_cycle:
        type: string
      currency:
        type: string
      description:
        type: string
      features:
        items:
          type: string
        type: array
      name:
        type: string
      price:
        type: number
      stripe_price_id:
        type: string
    type: object
  handlers.FeatureRequest:
    description: Request to update the featured status of an event
    properties:
      featured:
        type: boolean
    type: object
  handlers.ForgotPasswordRequest:
    properties:
      email:
        type: string
    required:
    - email
    type: object
  handlers.InstitutionDetailsResponse:
    properties:
      about:
        example: A leading Montessori school dedicated to providing quality education
          since 1995.
        type: string
      activities:
        items:
          properties:
            description:
              example: Weekly music classes incorporating movement and rhythm.
              type: string
            name:
              example: Music and Movement
              type: string
          type: object
        type: array
      created_at:
        example: "2023-01-01T12:00:00Z"
        type: string
      facts:
        example:
        - '[''Founded in 1995'''
        - ' ''Over 500 graduates'''
        - ' ''Award-winning curriculum'']'
        items:
          type: string
        type: array
      id:
        example: 1
        type: integer
      institution_name:
        example: Montessori Academy
        type: string
      is_verified:
        example: true
        type: boolean
      jobs:
        items:
          $ref: '#/definitions/handlers.JobResponse'
        type: array
      map:
        properties:
          address:
            example: 123 Education St, Springfield, IL 62701, USA
            type: string
          latitude:
            example: 39.78373
            type: number
          longitude:
            example: -89.65063
            type: number
        type: object
      philosophy:
        example: We believe in the Montessori method of education, which emphasizes
          independence, freedom within limits, and respect for a child's natural psychological,
          physical, and social development.
        type: string
      programs:
        items:
          properties:
            description:
              example: For children ages 3-6, focusing on sensorial development and
                practical life skills.
              type: string
            name:
              example: Early Childhood Program
              type: string
          type: object
        type: array
      reviews:
        items:
          $ref: '#/definitions/handlers.ReviewResponse'
        type: array
      school:
        $ref: '#/definitions/handlers.SchoolResponse'
      school_logo:
        example: https://example.com/school_logo.png
        type: string
      updated_at:
        example: "2023-01-15T14:30:00Z"
        type: string
      user:
        $ref: '#/definitions/handlers.UserResponse'
    type: object
  handlers.InstitutionProfileRequest:
    properties:
      institution_name:
        type: string
      verification_docs:
        description: URL or path
        type: string
    required:
    - institution_name
    type: object
  handlers.InstitutionPublicResponse:
    properties:
      about:
        example: A leading Montessori school dedicated to providing quality education
          since 1995.
        type: string
      contact_info:
        properties:
          address:
            example: 123 Education St, Springfield, IL 62701, USA
            type: string
          email:
            example: contact@montessoriacademy.example.com
            type: string
          phone:
            example: 555-123-4567
            type: string
          website:
            example: https://montessoriacademy.example.com
            type: string
        type: object
      created_at:
        example: "2023-01-01T12:00:00Z"
        type: string
      id:
        example: 1
        type: integer
      institution_name:
        example: Montessori Academy
        type: string
      is_verified:
        example: true
        type: boolean
      school_logo:
        example: https://example.com/school_logo.png
        type: string
      school_name:
        example: Montessori Academy Main Campus
        type: string
    type: object
  handlers.JobRequest:
    properties:
      description:
        type: string
      employment_type:
        type: string
      expires_at:
        description: e.g., "2024-12-31T23:59:59Z"
        type: string
      location:
        type: string
      salary_range:
        type: string
      title:
        type: string
    required:
    - description
    - title
    type: object
  handlers.JobResponse:
    properties:
      created_at:
        example: "2023-02-01T10:00:00Z"
        type: string
      description:
        example: Looking for an experienced Montessori teacher
        type: string
      id:
        example: 10
        type: integer
      location:
        example: Springfield, IL
        type: string
      requirements:
        example: 3+ years experience, Montessori certification
        type: string
      salary_range:
        example: $45,000 - $60,000
        type: string
      status:
        example: open
        type: string
      title:
        example: Montessori Teacher
        type: string
    type: object
  handlers.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  handlers.ManualSchoolCreationRequest:
    properties:
      address:
        type: string
      category:
        allOf:
        - $ref: '#/definitions/models.SchoolCategory'
        enum:
        - school
        - training_center
      city:
        type: string
      contact_email:
        type: string
      contact_phone:
        type: string
      country:
        type: string
      country_code:
        type: string
      name:
        type: string
      state:
        type: string
      website:
        type: string
      zip_code:
        type: string
    required:
    - category
    - country
    - country_code
    - name
    type: object
  handlers.MessageRequest:
    properties:
      content:
        type: string
    required:
    - content
    type: object
  handlers.ModerateReviewRequest:
    properties:
      notes:
        type: string
      status:
        allOf:
        - $ref: '#/definitions/models.ReviewStatus'
        enum:
        - approved
        - rejected
    required:
    - status
    type: object
  handlers.MontessoriProfessionalProfileRequest:
    properties:
      bio:
        type: string
      experience:
        type: string
      qualifications:
        type: string
    type: object
  handlers.ParentProfileRequest:
    properties:
      parent_age:
        type: integer
      phone_number:
        type: string
      profile_visibility:
        description: '"public" or "private"'
        type: string
      school_ids:
        description: Schools the parent's children attend
        items:
          type: integer
        type: array
    type: object
  handlers.RegisterRequest:
    properties:
      email:
        type: string
      first_name:
        type: string
      institution_name:
        description: Role-specific fields
        type: string
      last_name:
        type: string
      password:
        minLength: 8
        type: string
      role:
        allOf:
        - $ref: '#/definitions/models.UserRole'
        description: Admin role removed - only superadmin can create admins
        enum:
        - institution
        - montessori_professional
        - parent
        - training_center
    required:
    - email
    - first_name
    - last_name
    - password
    - role
    type: object
  handlers.ResetPasswordRequest:
    properties:
      new_password:
        minLength: 8
        type: string
      token:
        type: string
    required:
    - new_password
    - token
    type: object
  handlers.ReviewResponse:
    properties:
      comment:
        example: Excellent school with dedicated teachers and a nurturing environment.
        type: string
      created_at:
        example: "2023-03-10T09:15:00Z"
        type: string
      id:
        example: 15
        type: integer
      rating:
        example: 5
        type: integer
      reviewer:
        properties:
          name:
            example: Jane Smith
            type: string
        type: object
    type: object
  handlers.SchoolResponse:
    properties:
