  handlers.UnreadMessagePayload:
    properties:
      message_id:
        type: integer
      recipient_id:
        type: integer
      sender_id:
        type: integer
    type: object
  handlers.UpdateBlogCategoryRequest:
    properties:
      description:
        type: string
      name:
        type: string
    required:
    - name
    type: object
  handlers.UpdateBlogTagRequest:
    properties:
      name:
        type: string
    required:
    - name
    type: object
  handlers.UpdateSubscriptionPlanRequest:
    properties:
      allowed_roles:
        items:
          type: string
        type: array
      billing_cycle:
        type: string
      currency:
        type: string
      description:
        type: string
      features:
        items:
          type: string
        type: array
      is_active:
        type: boolean
      name:
        type: string
      price:
        type: number
      stripe_price_id:
        type: string
    type: object
  handlers.UserResponse:
    properties:
      email:
        example: john.doe@example.com
        type: string
      first_name:
        example: John
        type: string
      id:
        example: 42
        type: integer
      last_name:
        example: Doe
        type: string
    type: object
  handlers.UserRoleUpdateRequest:
    properties:
      role:
        allOf:
        - $ref: '#/definitions/models.UserRole'
        enum:
        - institution
        - montessori_professional
        - parent
        - training_center
        - admin
    required:
    - role
    type: object
  handlers.UserStatusUpdateRequest:
    properties:
      is_active:
        type: boolean
    type: object
  handlers.WebSocketMessage:
    properties:
      payload: {}
      type:
        type: string
    type: object
  models.InstitutionProfile:
    description: Institution or Training Center profile information
    properties:
      created_at:
        example: "2023-01-01T00:00:00Z"
        type: string
      deleted_at:
        example: "2023-01-01T00:00:00Z"
        format: date-time
        type: string
      id:
        example: 1
        type: integer
      institutionName:
        type: string
      isVerified:
        type: boolean
      jobs:
        items:
          $ref: '#/definitions/models.Job'
        type: array
      school:
        $ref: '#/definitions/models.School'
      schoolID:
        description: A school can be mapped to only one institution/training center
        type: integer
      updated_at:
        example: "2023-01-01T00:00:00Z"
        type: string
      user:
        allOf:
        - $ref: '#/definitions/models.User'
        description: Eager load user details if needed
      userID:
        description: Foreign key to User table
        type: integer
      verificationDocs:
        description: Path to verification documents
        type: string
    type: object
  models.Job:
    description: Job posting information
    properties:
      applications:
        items:
          $ref: '#/definitions/models.JobApplication'
        type: array
      created_at:
        example: "2023-01-01T00:00:00Z"
        type: string
      deleted_at:
        example: "2023-01-01T00:00:00Z"
        format: date-time
        type: string
      description:
        type: string
      employmentType:
        description: e.g., Full-time, Part-time
        type: string
      expiresAt:
        type: string
      id:
        example: 1
        type: integer
      institutionProfile:
        allOf:
        - $ref: '#/definitions/models.InstitutionProfile'
        description: Eager load institution profile
      institutionProfileID:
        description: Links to InstitutionProfile
        type: integer
      isActive:
        type: boolean
      location:
        type: string
      postedAt:
        type: string
      salaryRange:
        type: string
      title:
        type: string
      updated_at:
        example: "2023-01-01T00:00:00Z"
        type: string
    type: object
  models.JobApplication:
    description: Job application information
    properties:
      appliedAt:
        type: string
      coverLetter:
        type: string
      created_at:
        example: "2023-01-01T00:00:00Z"
        type: string
      deleted_at:
        example: "2023-01-01T00:00:00Z"
        format: date-time
        type: string
      id:
        example: 1
        type: integer
      job:
        $ref: '#/definitions/models.Job'
      jobID:
        type: integer
      montessoriProfessional:
        $ref: '#/definitions/models.MontessoriProfessionalProfile'
      montessoriProfessionalProfileID:
        description: Links to MontessoriProfessionalProfile
        type: integer
      resumeURL:
        type: string
      status:
        description: e.g., pending, viewed, shortlisted, rejected
        type: string
      updated_at:
        example: "2023-01-01T00:00:00Z"
        type: string
    type: object
  models.Message:
    description: Message information
    properties:
      content:
        type: string
      created_at:
        example: "2023-01-01T00:00:00Z"
        type: string
      deleted_at:
        example: "2023-01-01T00:00:00Z"
        format: date-time
        type: string
      id:
        example: 1
        type: integer
      isRead:
        description: Index for faster querying of unread messages
        type: boolean
      readAt:
        type: string
      recipient:
        $ref: '#/definitions/models.User'
      recipientID:
        type: integer
      sender:
        $ref: '#/definitions/models.User'
      senderID:
        type: integer
      sentAt:
        type: string
      updated_at:
        example: "2023-01-01T00:00:00Z"
        type: string
    type: object
  models.MontessoriProfessionalProfile:
    description: Montessori Professional profile information
    properties:
      applications:
        items:
          $ref: '#/definitions/models.JobApplication'
        type: array
      bio:
        type: string
      created_at:
        example: "2023-01-01T00:00:00Z"
        type: string
      deleted_at:
        example: "2023-01-01T00:00:00Z"
        format: date-time
        type: string
      experience:
        type: string
      id:
        example: 1
        type: integer
      qualifications:
        type: string
      savedSchools:
        items:
          $ref: '#/definitions/models.School'
        type: array
      updated_at:
        example: "2023-01-01T00:00:00Z"
        type: string
      user:
        allOf:
        - $ref: '#/definitions/models.User'
        description: Eager load user details
      userID:
        type: integer
    type: object
  models.ParentProfile:
    description: Parent profile information
    properties:
      created_at:
        example: "2023-01-01T00:00:00Z"
        type: string
      deleted_at:
        example: "2023-01-01T00:00:00Z"
        format: date-time
        type: string
      id:
        example: 1
        type: integer
      parentAge:
        description: Age of the parent
        type: integer
      profileVisibility:
        description: '"public" or "private"'
        type: string
      savedSchools:
        items:
          $ref: '#/definitions/models.School'
        type: array
      schools:
        description: Schools the parent's children attend
        items:
          $ref: '#/definitions/models.School'
        type: array
      updated_at:
        example: "2023-01-01T00:00:00Z"
        type: string
      user:
        allOf:
        - $ref: '#/definitions/models.User'
        description: Eager load user details
      userID:
        type: integer
    type: object
  models.ReviewStatus:
    enum:
    - pending
    - approved
    - rejected
    type: string
    x-enum-varnames:
    - ReviewPending
    - ReviewApproved
    - ReviewRejected
  models.School:
    description: School information
    properties:
      address:
        type: string
      category:
        allOf:
        - $ref: '#/definitions/models.SchoolCategory'
        description: For filtering by category
      city:
        type: string
      contactEmail:
        type: string
      contactPhone:
        type: string
      country:
        description: Full country name
        type: string
      countryCode:
        description: For searching by country
        type: string
      created_at:
        example: "2023-01-01T00:00:00Z"
        type: string
      createdByUserID:
        description: Pointer to allow NULL if uploaded by admin initially
        type: integer
      deleted_at:
        example: "2023-01-01T00:00:00Z"
        format: date-time
        type: string
      hiring:
        description: True if the associated institution has active job postings
        type: boolean
      id:
        example: 1
        type: integer
      member:
        description: True if an institution/training center has selected this school
        type: boolean
      name:
        type: string
      searchPageUrl:
        description: URL of the search page where this school was found
        type: string
      searchString:
        description: Search query used to find this school
        type: string
      state:
        type: string
      updated_at:
        example: "2023-01-01T00:00:00Z"
        type: string
      uploadedByAdmin:
        description: True if uploaded by admin batch
        type: boolean
      user:
        $ref: '#/definitions/models.User'
      website:
        type: string
      zipCode:
        type: string
    type: object
  models.SchoolCategory:
    enum:
    - school
    - training_center
    type: string
    x-enum-varnames:
    - SchoolCategorySchool
    - SchoolCategoryTrainingCenter
  models.User:
    description: User information
    properties:
      created_at:
        example: "2023-01-01T00:00:00Z"
        type: string
      deleted_at:
        example: "2023-01-01T00:00:00Z"
        format: date-time
        type: string
      email:
        type: string
      emailVerified:
        description: Email verification fields
        type: boolean
      firstName:
        type: string
      id:
        example: 1
        type: integer
      institutionProfile:
        allOf:
        - $ref: '#/definitions/models.InstitutionProfile'
        description: Relationships (depending on role)
      isActive:
        type: boolean
      lastLogin:
        type: string
      lastName:
        type: string
      montessoriProfessionalProfile:
        allOf:
        - $ref: '#/definitions/models.MontessoriProfessionalProfile'
        description: For Montessori Professional
      parentProfile:
        allOf:
        - $ref: '#/definitions/models.ParentProfile'
        description: For Parent
      passwordHash:
        description: Store hashed passwords only
        type: string
      passwordResetToken:
        description: Password reset fields
        type: string
      passwordResetTokenExpiry:
        description: Expiry time for password reset token
        type: string
      role:
        $ref: '#/definitions/models.UserRole'
      updated_at:
        example: "2023-01-01T00:00:00Z"
        type: string
      verificationToken:
        description: Token for email verification
        type: string
      verificationTokenExpiry:
        description: Expiry time for verification token
        type: string
    type: object
  models.UserRole:
    enum:
    - superadmin
    - admin
    - institution
    - montessori_professional
    - training_center
    - parent
    type: string
    x-enum-varnames:
    - SuperAdminRole
    - AdminRole
    - InstitutionRole
    - MontessoriProfessionalRole
    - TrainingCenterRole
    - ParentRole
info:
  contact: {}
paths:
  /admin/action-logs:
    get:
      description: Retrieves a list of action logs with pagination and filtering
      parameters:
      - default: 1
        description: Page number for pagination
        in: query
        name: page
        type: integer
