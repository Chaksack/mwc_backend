      email:
        type: string
      first_name:
        type: string
      last_name:
        type: string
      password:
        minLength: 8
        type: string
    required:
    - email
    - first_name
    - last_name
    - password
    type: object
  handlers.CreateBlogCategoryRequest:
    properties:
      description:
        type: string
      name:
        type: string
    required:
    - name
    type: object
  handlers.CreateBlogPostRequest:
    properties:
      category:
        type: string
      content:
        type: string
      excerpt:
        type: string
      is_featured:
        type: boolean
      is_published:
        type: boolean
      localizations:
        additionalProperties:
          additionalProperties:
            type: string
          type: object
        description: Map of language code to localized fields
        type: object
      tags:
        items:
          type: string
        type: array
      title:
        type: string
    required:
    - category
    - content
    - title
    type: object
  handlers.CreateBlogTagRequest:
    properties:
      name:
        type: string
