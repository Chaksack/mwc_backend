            type: object
        "404":
          description: School not found
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: User has already reviewed this school
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Create a new review
      tags:
      - reviews
  /reviews/{review_id}:
    delete:
      description: Allows an authenticated user to delete their own review.
      parameters:
      - description: Review ID
        in: path
        name: review_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Review deleted successfully
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad request or invalid review ID
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden - user can only delete their own reviews
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Review not found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Delete a review
      tags:
      - reviews
    put:
      consumes:
      - application/json
      description: Allows an authenticated user to update their own review. The updated
        review will be reset to pending status.
      parameters:
      - description: Review ID
        in: path
        name: review_id
        required: true
        type: integer
      - description: Updated review information
        in: body
        name: review
        required: true
        schema:
          $ref: '#/definitions/handlers.CreateReviewRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Review updated successfully and pending approval
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad request or invalid review ID/request body
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden - user can only update their own reviews
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Review not found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Update a review
      tags:
      - reviews
  /reviews/me:
    get:
      description: Retrieves all reviews submitted by the authenticated user.
      produces:
      - application/json
      responses:
        "200":
          description: List of reviews by the current user
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get current user's reviews
      tags:
      - reviews
      - users
  /schools/{school_id}/reviews:
    get:
      description: Retrieves all approved reviews for a specific school, along with
        the average rating and total review count.
      parameters:
      - description: School ID
        in: path
        name: school_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: List of reviews with average rating
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad request or invalid school ID
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: School not found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get school reviews
      tags:
      - reviews
      - schools
  /schools/public:
    get:
      description: Retrieves a list of public schools with optional filtering and
        pagination
      parameters:
      - description: Filter by school name
        in: query
        name: name
        type: string
      - description: Filter by city
        in: query
        name: city
        type: string
      - description: Filter by country code
        in: query
        name: country_code
        type: string
      - description: Filter by category (school or training_center)
        in: query
        name: category
        type: string
      - default: 1
        description: Page number for pagination
        in: query
        name: page
        type: integer
      - default: 10
        description: Number of items per page
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: List of schools with pagination metadata
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get public schools
      tags:
      - schools
  /subscription/cancel:
    post:
      consumes:
      - application/json
      description: Cancels the current user's active subscription
      parameters:
      - description: Cancellation reason
        in: body
        name: request
        schema:
          $ref: '#/definitions/handlers.CancelRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Subscription canceled successfully
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: User not authenticated
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: No active subscription found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Cancel user subscription
      tags:
      - subscription
  /subscription/checkout:
    post:
      consumes:
      - application/json
      description: Creates a Stripe checkout session for a user to subscribe to a
        plan
      parameters:
      - description: Subscription plan (monthly or annual)
        enum:
        - monthly
        - annual
        in: query
        name: plan
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Checkout session created successfully
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: User not authenticated
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: User already has an active subscription
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Create a checkout session for subscription
      tags:
      - subscription
  /subscription/status:
    get:
      description: Retrieves the current user's subscription details
      produces:
      - application/json
      responses:
        "200":
          description: Subscription details
          schema:
            additionalProperties: true
            type: object
        "401":
          description: User not authenticated
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: No subscription found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get user subscription
      tags:
      - subscription
  /verify-email:
    get:
      consumes:
      - application/json
      description: Verifies a user's email address using the verification token sent
        to their email
      parameters:
      - description: Verification token
        in: query
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Email verified successfully
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad request - missing or invalid token
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Invalid or expired token
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Verify user email address
      tags:
      - auth
      - public
  /webhooks/notify-unread-message:
    post:
      consumes:
      - application/json
      description: Receives a payload from the message queue system to process and
        send email notifications for unread messages. This endpoint is intended for
        internal system use and should be secured.
      parameters:
      - description: Details of the unread message to be processed for notification
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/handlers.UnreadMessagePayload'
      produces:
      - application/json
      responses:
        "200":
          description: Notification processed successfully (email sent or message
            already read)
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad request or invalid payload
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized access (if webhook security is implemented)
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error (e.g., database error, email sending
            failure)
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Webhook for Unread Message Notification
      tags:
      - webhooks
      - notifications
  /webhooks/stripe:
    post:
      consumes:
      - application/json
      description: Processes webhook events from Stripe for subscription management
      parameters:
      - description: Stripe signature for webhook verification
        in: header
        name: Stripe-Signature
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Webhook event processed successfully
          schema:
            additionalProperties:
              type: boolean
            type: object
        "400":
          description: Bad request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Handle Stripe webhook events
      tags:
      - webhooks
  /ws:
    get:
      description: Upgrades HTTP connection to WebSocket protocol for real-time communication
      responses:
        "101":
          description: Switching Protocols
          schema:
            type: string
        "401":
          description: User not authenticated
          schema:
            additionalProperties:
              type: string
            type: object
        "426":
          description: Upgrade Required - Client must request WebSocket upgrade
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: WebSocket connection upgrade
      tags:
      - websocket
  /ws/broadcast:
    post:
      consumes:
      - application/json
      description: Sends a real-time notification to all connected users via WebSocket
      parameters:
      - description: Type of notification
        in: body
        name: notification_type
        required: true
        schema:
          type: string
      - description: Notification payload
        in: body
        name: payload
        required: true
        schema: {}
      produces:
      - application/json
      responses:
        "200":
          description: Notification broadcasted successfully
          schema:
            $ref: '#/definitions/handlers.WebSocketMessage'
      security:
      - BearerAuth: []
      summary: Broadcast notification to all users
      tags:
      - websocket
  /ws/notify/{user_id}:
    post:
      consumes:
      - application/json
      description: Sends a real-time notification to a specific user via WebSocket
      parameters:
      - description: User ID to send notification to
        in: path
        name: user_id
        required: true
        type: integer
      - description: Type of notification
        in: body
        name: notification_type
        required: true
        schema:
          type: string
      - description: Notification payload
        in: body
        name: payload
        required: true
        schema: {}
      produces:
      - application/json
      responses:
        "200":
          description: Notification sent successfully
          schema:
            $ref: '#/definitions/handlers.WebSocketMessage'
        "404":
          description: User not connected
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Send notification to user
      tags:
      - websocket
securityDefinitions:
  BearerAuth:
    description: Provide your JWT token directly in the Authorization header without any prefix.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
