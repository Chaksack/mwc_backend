    - name
    type: object
  handlers.CreateEventRequest:
    properties:
      audience:
        type: string
      description:
        type: string
      end_date:
        type: string
      event_type:
        type: string
      is_published:
        type: boolean
      localizations:
        additionalProperties:
          type: string
        description: Map of language code to localized title/description
        type: object
      location:
        type: string
      max_attendees:
        type: integer
      start_date:
        type: string
      title:
        type: string
      virtual_event:
        type: boolean
      virtual_event_url:
        type: string
