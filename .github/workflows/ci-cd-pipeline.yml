name: CI/CD Pipeline with Security Analysis

on:
  push:
    branches: [ main, staging ]
  pull_request:
    branches: [ main, staging ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - dev
          - staging
          - prod

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: ${{ secrets.ECR || 'mwc-backend' }}
  ECS_CLUSTER: mwc-cluster
  ECS_SERVICE: mwc-backend-service
  ECS_TASK_DEFINITION: mwc-backend
  CONTAINER_NAME: mwc-backend
  IMAGE_TAG: latest
  SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
  EMAIL_RECIPIENTS: ${{ secrets.EMAIL_RECIPIENTS || 'admin@example.com' }}

jobs:
  # Security Analysis with CodeQL
  security-analysis:
    name: Security Analysis (CodeQL)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'go' ]

    steps:
    - name: 🔍 Step 1 - Checkout Source Code for Security Analysis
      uses: actions/checkout@v4

    - name: 🛡️ Step 2 - Initialize CodeQL Security Scanner
      uses: github/codeql-action/init@v3
      with:
        languages: ${{ matrix.language }}
        # Override language selection by uncommenting this and choosing your languages
        # languages: go, javascript, csharp, python, cpp, java, ruby

    - name: ⚙️ Step 3 - Setup Go Development Environment
      uses: actions/setup-go@v4
      with:
        go-version: '1.23'

    - name: 🔨 Step 4 - Build Application for Security Analysis
      run: |
        go mod tidy
        go build -v ./...

    - name: 🔬 Step 5 - Execute CodeQL Security Analysis
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:${{matrix.language}}"

  # Code Quality Analysis
  code-quality:
    name: Code Quality (SonarQube)
    runs-on: ubuntu-latest
    needs: deploy-sonarqube

    steps:
    - name: 📥 Step 1 - Checkout Source Code with Full History
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Shallow clones should be disabled for better relevancy of analysis

    - name: ⚙️ Step 2 - Setup Go Development Environment
      uses: actions/setup-go@v4
      with:
        go-version: '1.23'

    - name: 🧪 Step 3 - Execute Tests with Coverage Analysis
      run: |
        go mod tidy
        go test ./... -coverprofile=coverage.out

    - name: 📊 Step 4 - Run SonarQube Code Quality Scan
      uses: SonarSource/sonarqube-scan-action@master
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      with:
        args: >
          -Dsonar.projectKey=mwc_backend
          -Dsonar.projectName=MWC Backend
          -Dsonar.sources=.
          -Dsonar.go.coverage.reportPaths=coverage.out
          -Dsonar.exclusions=**/*_test.go,**/vendor/**,**/testdata/**

    - name: ✅ Step 5 - Verify SonarQube Quality Gate Status
      uses: SonarSource/sonarqube-quality-gate-action@master
      timeout-minutes: 5
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
  slack-notification-success:
    name: Code Quality Analysis Success
    runs-on: ubuntu-latest
    needs: code-quality
    if: success()
    steps:
    - name: Notify Slack Success
      uses: rtCamp/action-slack-notify@v2
      env:
        SLACK_CHANNEL: code-quality
        SLACK_COLOR: good
        SLACK_ICON: https://github.com/rtCamp.png?size=48
        SLACK_MESSAGE: |
          ✅ Code quality analysis passed for ${{ github.repository }}
          *Branch:* ${{ github.ref_name }}
          *Commit:* ${{ github.sha }}
          *Check the [SonarQube Dashboard](${{ secrets.SONAR_HOST_URL }}/dashboard?id=mwc_backend) for more details*
        SLACK_TITLE: Code Quality Analysis Success
        SLACK_USERNAME: GitHub Actions
        SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}

  slack-notification-failure:
    name: Code Quality Analysis Failure
    runs-on: ubuntu-latest
    needs: code-quality
    if: failure()
    steps:
    - name: Notify Slack Failure
      uses: rtCamp/action-slack-notify@v2
      env:
        SLACK_CHANNEL: code-quality
        SLACK_COLOR: danger
        SLACK_ICON: https://github.com/rtCamp.png?size=48
        SLACK_MESSAGE: |
          ❌ Code quality analysis failed for ${{ github.repository }}
          *Branch:* ${{ github.ref_name }}
          *Commit:* ${{ github.sha }}
          *Check the [GitHub Actions logs](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) for more details*
        SLACK_TITLE: Code Quality Analysis Failure
        SLACK_USERNAME: GitHub Actions
        SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}

  email-notification:
    name: Code Quality Analysis Failed
    runs-on: ubuntu-latest
    needs: code-quality
    if: failure()
    steps:
    - name: Send Email Notification
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: ${{ secrets.SMTP_HOST }}
        server_port: ${{ secrets.SMTP_PORT }}
        username: ${{ secrets.SMTP_USER }}
        password: ${{ secrets.SMTP_PASSWORD }}
        subject: "🚨 Code Quality Analysis Failed - ${{ github.repository }}"
        to: ${{ env.EMAIL_RECIPIENTS }}
        from: ${{ secrets.EMAIL_FROM }}
        body: |
          Code Quality Analysis Failed

          Repository: ${{ github.repository }}
          Branch: ${{ github.ref_name }}
          Commit: ${{ github.sha }}
          Workflow: ${{ github.workflow }}
          Run ID: ${{ github.run_id }}

          The SonarQube code quality analysis has failed. Please check the following:
          - SonarQube Dashboard: ${{ secrets.SONAR_HOST_URL }}/dashboard?id=mwc_backend
          - GitHub Actions logs: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

          This is an automated notification from GitHub Actions.

  # Build and Push Docker Image
  build-and-push-app:
    name: Build and Push to ECR
    runs-on: ubuntu-latest
    needs: [security-analysis, code-quality]
    if: github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'

    env:
      ENVIRONMENT: ${{ github.event.inputs.environment || (github.ref == 'refs/heads/main' && 'prod') || 'staging' }}

    outputs:
      image: ${{ steps.build-image.outputs.image }}
      environment: ${{ env.ENVIRONMENT }}

    steps:
    - name: 📥 Step 1 - Checkout Application Source Code
      uses: actions/checkout@v4

    - name: 🐳 Step 2 - Setup Docker Buildx for Multi-Platform Builds
      uses: docker/setup-buildx-action@v3

    - name: 🔑 Step 3 - Configure AWS Credentials for ECR Access
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: 🚪 Step 4 - Authenticate with Amazon ECR Registry
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: 📦 Step 5 - Create ECR Repository if Missing
      run: |
        if ! aws ecr describe-repositories --repository-names ${{ env.ECR_REPOSITORY }} 2>/dev/null; then
          echo "Repository ${{ env.ECR_REPOSITORY }} does not exist. Creating it..."
          aws ecr create-repository --repository-name ${{ env.ECR_REPOSITORY }}
        else
          echo "Repository ${{ env.ECR_REPOSITORY }} already exists."
        fi

    - name: 💾 Step 6 - Setup Docker Layer Caching for Faster Builds
      uses: actions/cache@v4
      with:
        path: /tmp/.buildx-cache
        key: ${{ runner.os }}-buildx-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-buildx-

    - name: 🔨 Step 7 - Build and Tag Docker Image for ECR
      id: build-image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
      run: |
        ENV_TAG=${{ env.ENVIRONMENT }}
        echo "Building Docker image for $ENV_TAG environment..."

        docker buildx build \
          --cache-from=type=local,src=/tmp/.buildx-cache \
          --cache-to=type=local,dest=/tmp/.buildx-cache-new \
          --build-arg DATABASE_URL=${{ secrets.DATABASE_URL }} \
          --build-arg RABBITMQ_URL=${{ secrets.RABBITMQ_URL }} \
          --build-arg RABBITMQ_USE_TLS=true \
          --build-arg JWT_SECRET=${{ secrets.JWT_SECRET }} \
          --build-arg SMTP_HOST=${{ secrets.SMTP_HOST }} \
          --build-arg SMTP_PORT=${{ secrets.SMTP_PORT }} \
          --build-arg SMTP_USER=${{ secrets.SMTP_USER }} \
          --build-arg SMTP_PASSWORD=${{ secrets.SMTP_PASSWORD }} \
          --build-arg EMAIL_FROM="${{ secrets.EMAIL_FROM }}" \
          --build-arg STRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY }} \
          --build-arg STRIPE_PUBLISHABLE_KEY=${{ secrets.STRIPE_PUBLISHABLE_KEY }} \
          --build-arg STRIPE_WEBHOOK_SECRET=${{ secrets.STRIPE_WEBHOOK_SECRET }} \
          --build-arg STRIPE_MONTHLY_PRICE_ID=${{ secrets.STRIPE_MONTHLY_PRICE_ID }} \
          --build-arg STRIPE_ANNUAL_PRICE_ID=${{ secrets.STRIPE_ANNUAL_PRICE_ID }} \
          --tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
          --tag $ECR_REGISTRY/$ECR_REPOSITORY:latest \
          --tag $ECR_REGISTRY/$ECR_REPOSITORY:$ENV_TAG \
          --push \
          --file Dockerfile \
          .

        echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$ENV_TAG" >> $GITHUB_OUTPUT

        # Clean up cache
        rm -rf /tmp/.buildx-cache
        mv /tmp/.buildx-cache-new /tmp/.buildx-cache
  slack-notification-build-success:
    name: Docker Build Success
    runs-on: ubuntu-latest
    needs: build-and-push
    if: success()
    steps:
    - name: Notify Slack Build Success
      uses: rtCamp/action-slack-notify@v2
      env:
        SLACK_CHANNEL: deployments
        SLACK_COLOR: good
        SLACK_ICON: https://github.com/rtCamp.png?size=48
        SLACK_MESSAGE: |
          ✅ Successfully built and pushed Docker image
          *Environment:* ${{ env.ENVIRONMENT }}
          *Image:* ${{ steps.build-image.outputs.image }}
          *Repository:* ${{ github.repository }}
          *Branch:* ${{ github.ref_name }}
          *Commit:* ${{ github.sha }}
        SLACK_TITLE: Docker Build Success
        SLACK_USERNAME: GitHub Actions
        SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}

  slack-notification-build-failure:
    name: Docker Build Failure
    runs-on: ubuntu-latest
    needs: build-and-push
    if: failure()
    steps:
    - name: Notify Slack Build Failure
      uses: rtCamp/action-slack-notify@v2
      env:
        SLACK_CHANNEL: deployments
        SLACK_COLOR: danger
        SLACK_ICON: https://github.com/rtCamp.png?size=48
        SLACK_MESSAGE: |
          ❌ Failed to build and push Docker image
          *Environment:* ${{ env.ENVIRONMENT }}
          *Repository:* ${{ github.repository }}
          *Branch:* ${{ github.ref_name }}
          *Check the [GitHub Actions logs](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) for more details*
        SLACK_TITLE: Docker Build Failure
        SLACK_USERNAME: GitHub Actions
        SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}

  email-notification-build-failure:
    name: Docker Build Failed
    runs-on: ubuntu-latest
    needs: build-and-push
    if: failure()
    steps:
    - name: Send Email Build Failure
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: ${{ secrets.SMTP_HOST }}
        server_port: ${{ secrets.SMTP_PORT }}
        username: ${{ secrets.SMTP_USER }}
        password: ${{ secrets.SMTP_PASSWORD }}
        subject: "🚨 Docker Build Failed - ${{ github.repository }} (${{ env.ENVIRONMENT }})"
        to: ${{ env.EMAIL_RECIPIENTS }}
        from: ${{ secrets.EMAIL_FROM }}
        body: |
          Docker Build and Push Failed

          Repository: ${{ github.repository }}
          Environment: ${{ env.ENVIRONMENT }}
          Branch: ${{ github.ref_name }}
          Commit: ${{ github.sha }}
          Workflow: ${{ github.workflow }}
          Run ID: ${{ github.run_id }}

          The Docker image build and push to ECR has failed. Please check:
          - GitHub Actions logs: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          - ECR Repository: ${{ env.ECR_REPOSITORY }}
          - AWS Region: ${{ env.AWS_REGION }}

          This failure may prevent deployment to the ${{ env.ENVIRONMENT }} environment.

          This is an automated notification from GitHub Actions.

  # Trivy Security Scanning
  trivy-scan:
    name: Trivy Security Scan
    runs-on: ubuntu-latest
    needs: build-and-push
    if: success()

    env:
      ENVIRONMENT: ${{ needs.build-and-push.outputs.environment }}

    steps:
    - name: 📥 Step 1 - Checkout Source Code for Security Scanning
      uses: actions/checkout@v4

    - name: 🔑 Step 2 - Configure AWS Credentials for ECR Access
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: 🚪 Step 3 - Authenticate with Amazon ECR Registry
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: 🛡️ Step 4 - Run Trivy Container Image Vulnerability Scan
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ${{ needs.build-and-push.outputs.image }}
        format: 'sarif'
        output: 'trivy-image-results.sarif'

    - name: 📊 Step 5 - Upload Image Scan Results to GitHub Security Tab
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: 'trivy-image-results.sarif'

    - name: 📁 Step 6 - Run Trivy Filesystem Vulnerability Scan
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-fs-results.sarif'

    - name: 📊 Step 7 - Upload Filesystem Scan Results to GitHub Security Tab
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: 'trivy-fs-results.sarif'

    - name: 🏗️ Step 8 - Run Trivy Infrastructure as Code (IaC) Security Scan
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'config'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-config-results.sarif'

    - name: 📊 Step 9 - Upload IaC Scan Results to GitHub Security Tab
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: 'trivy-config-results.sarif'

    - name: 📋 Step 10 - Generate Trivy Security Scan Summary Report
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ${{ needs.build-and-push.outputs.image }}
        format: 'table'
        output: 'trivy-summary.txt'

    - name: 📖 Step 11 - Display Security Scan Summary in GitHub Actions
      if: always()
      run: |
        echo "## Trivy Security Scan Summary" >> $GITHUB_STEP_SUMMARY
        echo "### Container Image Vulnerabilities" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        cat trivy-summary.txt >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY

    - name: ⚠️ Step 12 - Validate Security Scan - Check for Critical Vulnerabilities
      id: trivy-check
      run: |
        # Check if there are any HIGH or CRITICAL vulnerabilities
        if grep -q -E "(HIGH|CRITICAL)" trivy-summary.txt; then
          echo "high_critical_found=true" >> $GITHUB_OUTPUT
          echo "❌ HIGH or CRITICAL vulnerabilities found!"
          exit 1
        else
          echo "high_critical_found=false" >> $GITHUB_OUTPUT
          echo "✅ No HIGH or CRITICAL vulnerabilities found!"
        fi
  slack-notification-trivy-success:
    name: Trivy Security Scan Success
    runs-on: ubuntu-latest
    needs: trivy-scan
    if: success()
    steps:
    - name: Notify Slack Trivy Success
      uses: rtCamp/action-slack-notify@v2
      env:
        SLACK_CHANNEL: deployments
        SLACK_COLOR: good
        SLACK_ICON: https://github.com/rtCamp.png?size=48
        SLACK_MESSAGE: |
          ✅ Trivy security scan passed for ${{ github.repository }}
          *Environment:* ${{ env.ENVIRONMENT }}
          *Image:* ${{ needs.build-and-push.outputs.image }}
          *Branch:* ${{ github.ref_name }}
          *No HIGH or CRITICAL vulnerabilities found*
        SLACK_TITLE: Trivy Security Scan Success
        SLACK_USERNAME: GitHub Actions
        SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}

  slack-notification-trivy-failure:
    name: Trivy Security Scan Failure
    runs-on: ubuntu-latest
    needs: trivy-scan
    if: failure()
    steps:
    - name: Notify Slack Trivy Failure
      uses: rtCamp/action-slack-notify@v2
      env:
        SLACK_CHANNEL: deployments
        SLACK_COLOR: danger
        SLACK_ICON: https://github.com/rtCamp.png?size=48
        SLACK_MESSAGE: |
          ❌ Trivy security scan failed for ${{ github.repository }}
          *Environment:* ${{ env.ENVIRONMENT }}
          *Image:* ${{ needs.build-and-push.outputs.image }}
          *Branch:* ${{ github.ref_name }}
          *HIGH or CRITICAL vulnerabilities found - check the [GitHub Actions logs](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) and Security tab for details*
        SLACK_TITLE: Trivy Security Scan Failure
        SLACK_USERNAME: GitHub Actions
        SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}

  email-notification-trivy:
    name: Critical Vulnerabilities Found
    runs-on: ubuntu-latest
    needs: trivy-scan
    if: failure()
    steps:
    - name: Send Email Trivy Alert
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: ${{ secrets.SMTP_HOST }}
        server_port: ${{ secrets.SMTP_PORT }}
        username: ${{ secrets.SMTP_USER }}
        password: ${{ secrets.SMTP_PASSWORD }}
        subject: "🚨 CRITICAL SECURITY ALERT - Vulnerabilities Found in ${{ github.repository }}"
        to: ${{ env.EMAIL_RECIPIENTS }}
        from: ${{ secrets.EMAIL_FROM }}
        body: |
          CRITICAL SECURITY ALERT: High/Critical Vulnerabilities Found

          Repository: ${{ github.repository }}
          Environment: ${{ env.ENVIRONMENT }}
          Image: ${{ needs.build-and-push.outputs.image }}
          Branch: ${{ github.ref_name }}
          Commit: ${{ github.sha }}
          Workflow: ${{ github.workflow }}
          Run ID: ${{ github.run_id }}

          ⚠️ IMMEDIATE ACTION REQUIRED ⚠️

          Trivy security scan has detected HIGH or CRITICAL vulnerabilities in the container image.
          Deployment has been blocked to prevent security risks.

          Please review:
          - GitHub Actions logs: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          - GitHub Security tab: https://github.com/${{ github.repository }}/security
          - Scan results in the workflow summary

          DO NOT DEPLOY until these vulnerabilities are resolved.

          This is an automated security alert from GitHub Actions.

  # Deploy to AWS ECS
  deploy:
    name: Deploy to ECS
    runs-on: ubuntu-latest
    needs: [build-and-push, trivy-scan]
    if: success() && (github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')

    env:
      ENVIRONMENT: ${{ needs.build-and-push.outputs.environment }}

    steps:
    - name: 📥 Step 1 - Checkout Application Source Code for Deployment
      uses: actions/checkout@v4

    - name: 🔑 Step 2 - Configure AWS Credentials for ECS Deployment
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: 🚪 Step 3 - Authenticate with Amazon ECR Registry
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: 🆔 Step 4 - Retrieve AWS Account ID for Task Definition
      id: get-aws-account
      run: |
        AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
        echo "aws_account_id=$AWS_ACCOUNT_ID" >> $GITHUB_OUTPUT

    - name: 📋 Step 5 - Prepare ECS Task Definition Template
      run: |
        sed -i "s/ACCOUNT_ID/${{ steps.get-aws-account.outputs.aws_account_id }}/g" task-definition.json

    - name: 🔧 Step 6 - Inject Environment Variables and Secrets into Task Definition
      run: |
        sed -i "s/DATABASE_URL_PLACEHOLDER/${{ secrets.DATABASE_URL }}/g" task-definition.json
        sed -i "s/RABBITMQ_URL_PLACEHOLDER/${{ secrets.RABBITMQ_URL }}/g" task-definition.json
        sed -i "s/JWT_SECRET_PLACEHOLDER/${{ secrets.JWT_SECRET }}/g" task-definition.json
        sed -i "s/SMTP_HOST_PLACEHOLDER/${{ secrets.SMTP_HOST }}/g" task-definition.json
        sed -i "s/SMTP_PORT_PLACEHOLDER/${{ secrets.SMTP_PORT }}/g" task-definition.json
        sed -i "s/SMTP_USER_PLACEHOLDER/${{ secrets.SMTP_USER }}/g" task-definition.json
        sed -i "s/SMTP_PASSWORD_PLACEHOLDER/${{ secrets.SMTP_PASSWORD }}/g" task-definition.json
        sed -i "s/EMAIL_FROM_PLACEHOLDER/${{ secrets.EMAIL_FROM }}/g" task-definition.json
        sed -i "s/STRIPE_SECRET_KEY_PLACEHOLDER/${{ secrets.STRIPE_SECRET_KEY }}/g" task-definition.json
        sed -i "s/STRIPE_PUBLISHABLE_KEY_PLACEHOLDER/${{ secrets.STRIPE_PUBLISHABLE_KEY }}/g" task-definition.json
        sed -i "s/STRIPE_WEBHOOK_SECRET_PLACEHOLDER/${{ secrets.STRIPE_WEBHOOK_SECRET }}/g" task-definition.json
        sed -i "s/STRIPE_MONTHLY_PRICE_ID_PLACEHOLDER/${{ secrets.STRIPE_MONTHLY_PRICE_ID }}/g" task-definition.json
        sed -i "s/STRIPE_ANNUAL_PRICE_ID_PLACEHOLDER/${{ secrets.STRIPE_ANNUAL_PRICE_ID }}/g" task-definition.json

    - name: 🐳 Step 7 - Update Task Definition with New Container Image
      id: update-image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: mwc-backend
        IMAGE_TAG: ${{ env.ENVIRONMENT }}
        AWS_ACCOUNT_ID: ${{ steps.get-aws-account.outputs.aws_account_id }}
      run: |
        NEW_IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
        sed -i "s|$AWS_ACCOUNT_ID.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/$ECR_REPOSITORY:[^ \"]*|$NEW_IMAGE|g" task-definition.json
        echo "image=$NEW_IMAGE" >> $GITHUB_OUTPUT

    - name: 📝 Step 8 - Register New Task Definition Revision with ECS
      id: register-task
      run: |
        NEW_TASK_DEF=$(aws ecs register-task-definition --cli-input-json file://task-definition.json)
        NEW_REVISION=$(echo $NEW_TASK_DEF | jq -r '.taskDefinition.revision')
        echo "revision=$NEW_REVISION" >> $GITHUB_OUTPUT

    - name: 🚀 Step 9 - Deploy Application to ECS Cluster
      run: |
        aws ecs update-service \
          --cluster ${{ env.ECS_CLUSTER }} \
          --service ${{ env.ECS_SERVICE }} \
          --task-definition ${{ env.ECS_TASK_DEFINITION }}:${{ steps.register-task.outputs.revision }} \
          --force-new-deployment

    - name: ⏳ Step 10 - Wait for ECS Service Deployment to Stabilize
      run: |
        aws ecs wait services-stable \
          --cluster ${{ env.ECS_CLUSTER }} \
          --services ${{ env.ECS_SERVICE }}

  slack-notification-deploy-success:
    name: ECS Deployment Success
    runs-on: ubuntu-latest
    needs: deploy
    if: success()
    steps:
    - name: Notify Slack Deploy Success
      uses: rtCamp/action-slack-notify@v2
      env:
        SLACK_CHANNEL: deployments
        SLACK_COLOR: good
        SLACK_ICON: https://github.com/rtCamp.png?size=48
        SLACK_MESSAGE: |
          ✅ Successfully deployed to ECS in ${{ env.ENVIRONMENT }} environment
          *Cluster:* ${{ env.ECS_CLUSTER }}
          *Service:* ${{ env.ECS_SERVICE }}
          *Task Definition:* ${{ env.ECS_TASK_DEFINITION }}:${{ steps.register-task.outputs.revision }}
          *Image:* ${{ steps.update-image.outputs.image }}
        SLACK_TITLE: ECS Deployment Success
        SLACK_USERNAME: GitHub Actions
        SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}

  slack-notification-deploy-failure:
    name: ECS Deployment Failure
    runs-on: ubuntu-latest
    needs: deploy
    if: failure()
    steps:
    - name: Notify Slack Deploy Failure
      uses: rtCamp/action-slack-notify@v2
      env:
        SLACK_CHANNEL: deployments
        SLACK_COLOR: danger
        SLACK_ICON: https://github.com/rtCamp.png?size=48
        SLACK_MESSAGE: |
          ❌ Failed to deploy to ECS in ${{ env.ENVIRONMENT }} environment
          *Repository:* ${{ github.repository }}
          *Workflow:* ${{ github.workflow }}
          *Check the [GitHub Actions logs](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) for more details*
        SLACK_TITLE: ECS Deployment Failure
        SLACK_USERNAME: GitHub Actions
        SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}

  email-notification-deploy-failure:
    name: Deployment Failed
    runs-on: ubuntu-latest
    needs: deploy
    if: failure()
    steps:
    - name: Send Email Deploy Failure
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: ${{ secrets.SMTP_HOST }}
        server_port: ${{ secrets.SMTP_PORT }}
        username: ${{ secrets.SMTP_USER }}
        password: ${{ secrets.SMTP_PASSWORD }}
        subject: "🚨 Deployment Failed - ${{ github.repository }} (${{ env.ENVIRONMENT }})"
        to: ${{ env.EMAIL_RECIPIENTS }}
        from: ${{ secrets.EMAIL_FROM }}
        body: |
          Application Deployment Failed

          Repository: ${{ github.repository }}
          Environment: ${{ env.ENVIRONMENT }}
          Branch: ${{ github.ref_name }}
          Commit: ${{ github.sha }}
          Workflow: ${{ github.workflow }}
          Run ID: ${{ github.run_id }}

          Deployment Details:
          - ECS Cluster: ${{ env.ECS_CLUSTER }}
          - ECS Service: ${{ env.ECS_SERVICE }}
          - Task Definition: ${{ env.ECS_TASK_DEFINITION }}
          - AWS Region: ${{ env.AWS_REGION }}

          The application deployment to ${{ env.ENVIRONMENT }} environment has failed.
          This may cause service downtime or prevent new features from being deployed.

          Please review:
          - GitHub Actions logs: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          - AWS ECS Console for service status
          - Application health checks

          This is an automated notification from GitHub Actions.

  email-notification-prod-success:
    name: Production Deployment Success
    runs-on: ubuntu-latest
    needs: deploy
    if: success() && env.ENVIRONMENT == 'prod'
    steps:
    - name: Send Email Prod Success
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: ${{ secrets.SMTP_HOST }}
        server_port: ${{ secrets.SMTP_PORT }}
        username: ${{ secrets.SMTP_USER }}
        password: ${{ secrets.SMTP_PASSWORD }}
        subject: "✅ Production Deployment Successful - ${{ github.repository }}"
        to: ${{ env.EMAIL_RECIPIENTS }}
        from: ${{ secrets.EMAIL_FROM }}
        body: |
          Production Deployment Successful

          Repository: ${{ github.repository }}
          Environment: ${{ env.ENVIRONMENT }}
          Branch: ${{ github.ref_name }}
          Commit: ${{ github.sha }}
          Workflow: ${{ github.workflow }}
          Run ID: ${{ github.run_id }}

          Deployment Details:
          - ECS Cluster: ${{ env.ECS_CLUSTER }}
          - ECS Service: ${{ env.ECS_SERVICE }}
          - Task Definition: ${{ env.ECS_TASK_DEFINITION }}:${{ steps.register-task.outputs.revision }}
          - Image: ${{ steps.update-image.outputs.image }}

          The application has been successfully deployed to production.
          All services should now be running the latest version.

          This is an automated notification from GitHub Actions.

  # Deploy SonarQube to ECS
  deploy-sonarqube:
    name: Deploy SonarQube to ECS
    runs-on: ubuntu-latest
    needs: security-analysis
    if: success() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging')

    env:
      ENVIRONMENT: ${{ github.event.inputs.environment || (github.ref == 'refs/heads/main' && 'prod') || 'staging' }}
      ECS_SONAR_SERVICE: mwc-sonarqube-service
      ECS_SONAR_TASK_DEFINITION: mwc-sonarqube

    steps:
    - name: 📥 Step 1 - Checkout Source Code for SonarQube Deployment
      uses: actions/checkout@v4

    - name: 🔑 Step 2 - Configure AWS Credentials for SonarQube ECS Deployment
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: 🆔 Step 3 - Retrieve AWS Account ID for SonarQube Task Definition
      id: get-aws-account
      run: |
        AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
        echo "aws_account_id=$AWS_ACCOUNT_ID" >> $GITHUB_OUTPUT

    - name: 📋 Step 4 - Prepare SonarQube ECS Task Definition Template
      run: |
        sed -i "s/ACCOUNT_ID/${{ steps.get-aws-account.outputs.aws_account_id }}/g" sonarqube-task-definition.json

    - name: 🔧 Step 5 - Configure SonarQube Database and Storage Settings
      run: |
        # Validate required secrets are not empty
        if [ -z "${{ secrets.SONAR_DATABASE_URL }}" ]; then
          echo "Error: SONAR_DATABASE_URL secret is not set or empty"
          exit 1
        fi
        if [ -z "${{ secrets.SONAR_DATABASE_USERNAME }}" ]; then
          echo "Error: SONAR_DATABASE_USERNAME secret is not set or empty"
          exit 1
        fi
        if [ -z "${{ secrets.SONAR_DATABASE_PASSWORD }}" ]; then
          echo "Error: SONAR_DATABASE_PASSWORD secret is not set or empty"
          exit 1
        fi
        if [ -z "${{ secrets.EFS_FILESYSTEM_ID }}" ]; then
          echo "Error: EFS_FILESYSTEM_ID secret is not set or empty"
          echo "Please ensure the EFS filesystem ID is configured in GitHub secrets"
          exit 1
        fi
        
        echo "Replacing placeholders with actual values..."
        sed -i "s/SONAR_DATABASE_URL_PLACEHOLDER/${{ secrets.SONAR_DATABASE_URL }}/g" sonarqube-task-definition.json
        sed -i "s/SONAR_DATABASE_USERNAME_PLACEHOLDER/${{ secrets.SONAR_DATABASE_USERNAME }}/g" sonarqube-task-definition.json
        sed -i "s/SONAR_DATABASE_PASSWORD_PLACEHOLDER/${{ secrets.SONAR_DATABASE_PASSWORD }}/g" sonarqube-task-definition.json
        sed -i "s/EFS_FILESYSTEM_ID_PLACEHOLDER/${{ secrets.EFS_FILESYSTEM_ID }}/g" sonarqube-task-definition.json
        
        # Verify replacements were successful
        if grep -q "EFS_FILESYSTEM_ID_PLACEHOLDER" sonarqube-task-definition.json; then
          echo "Error: EFS_FILESYSTEM_ID_PLACEHOLDER was not replaced properly"
          cat sonarqube-task-definition.json | grep -A5 -B5 "EFS_FILESYSTEM_ID_PLACEHOLDER"
          exit 1
        fi
        
        echo "All placeholders successfully replaced"

    - name: 📝 Step 6 - Register SonarQube Task Definition Revision with ECS
      id: register-sonar-task
      run: |
        NEW_TASK_DEF=$(aws ecs register-task-definition --cli-input-json file://sonarqube-task-definition.json)
        NEW_REVISION=$(echo $NEW_TASK_DEF | jq -r '.taskDefinition.revision')
        echo "revision=$NEW_REVISION" >> $GITHUB_OUTPUT

    - name: 🚀 Step 7 - Deploy SonarQube Service to ECS Cluster
      run: |
        if aws ecs describe-services --cluster ${{ env.ECS_CLUSTER }} --services ${{ env.ECS_SONAR_SERVICE }} 2>/dev/null | grep -q "ACTIVE\|RUNNING"; then
          echo "Updating existing SonarQube service..."
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service ${{ env.ECS_SONAR_SERVICE }} \
            --task-definition ${{ env.ECS_SONAR_TASK_DEFINITION }}:${{ steps.register-sonar-task.outputs.revision }} \
            --force-new-deployment
        else
          echo "Creating new SonarQube service..."
          aws ecs create-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service-name ${{ env.ECS_SONAR_SERVICE }} \
            --task-definition ${{ env.ECS_SONAR_TASK_DEFINITION }}:${{ steps.register-sonar-task.outputs.revision }} \
            --desired-count 1 \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[${{ secrets.ECS_SUBNET_IDS }}],securityGroups=[${{ secrets.ECS_SECURITY_GROUP_ID }}],assignPublicIp=ENABLED}"
        fi

    - name: ⏳ Step 8 - Wait for SonarQube Service Deployment to Stabilize
      run: |
        aws ecs wait services-stable \
          --cluster ${{ env.ECS_CLUSTER }} \
          --services ${{ env.ECS_SONAR_SERVICE }}

  slack-notification-sonar-success:
    name: SonarQube ECS Deployment Success
    runs-on: ubuntu-latest
    needs: deploy-sonarqube
    if: success()
    steps:
    - name: Notify Slack SonarQube Success
      uses: rtCamp/action-slack-notify@v2
      env:
        SLACK_CHANNEL: deployments
        SLACK_COLOR: good
        SLACK_ICON: https://github.com/rtCamp.png?size=48
        SLACK_MESSAGE: |
          ✅ SonarQube deployed to ECS in ${{ env.ENVIRONMENT }} environment
          *Cluster:* ${{ env.ECS_CLUSTER }}
          *Service:* ${{ env.ECS_SONAR_SERVICE }}
          *Task Definition:* ${{ env.ECS_SONAR_TASK_DEFINITION }}:${{ steps.register-sonar-task.outputs.revision }}
        SLACK_TITLE: SonarQube ECS Deployment Success
        SLACK_USERNAME: GitHub Actions
        SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}

  # Deploy Prometheus to ECS
  deploy-prometheus:
    name: Deploy Prometheus to ECS
    runs-on: ubuntu-latest
    needs: deploy
    if: success() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging')

    env:
      ENVIRONMENT: ${{ needs.build-and-push.outputs.environment }}
      ECS_PROMETHEUS_SERVICE: mwc-prometheus-service
      ECS_PROMETHEUS_TASK_DEFINITION: mwc-prometheus

    steps:
    - name: 📥 Step 1 - Checkout Source Code for Prometheus Deployment
      uses: actions/checkout@v4

    - name: 🔑 Step 2 - Configure AWS Credentials for Prometheus ECS Deployment
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: 🆔 Step 3 - Retrieve AWS Account ID for Prometheus Task Definition
      id: get-aws-account
      run: |
        AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
        echo "aws_account_id=$AWS_ACCOUNT_ID" >> $GITHUB_OUTPUT

    - name: 📊 Step 4 - Create Prometheus and AlertManager Configuration Files
      run: |
        # Create Prometheus configuration
        mkdir -p prometheus-config
        cat > prometheus-config/prometheus.yml <<EOF
        global:
          scrape_interval: 15s
          evaluation_interval: 15s

        alerting:
          alertmanagers:
            - static_configs:
                - targets: ['localhost:9093']

        rule_files:
          - "alert_rules.yml"

        scrape_configs:
          - job_name: 'mwc-backend'
            metrics_path: '/metrics/prometheus'
            ec2_sd_configs:
              - region: ${{ env.AWS_REGION }}
                port: 8080
            relabel_configs:
              - source_labels: [__meta_ec2_tag_Name]
                target_label: instance
        EOF

        # Create AlertManager configuration
        mkdir -p alertmanager-config
        cat > alertmanager-config/alertmanager.yml <<EOF
        global:
          slack_api_url: '${{ secrets.SLACK_WEBHOOK }}'
          resolve_timeout: 5m

        route:
          group_by: ['alertname', 'job']
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 4h
          receiver: 'slack-notifications'

        receivers:
          - name: 'slack-notifications'
            slack_configs:
              - channel: '#alerts'
                send_resolved: true
                title: '{{ .Status | toUpper }} {{ .CommonLabels.alertname }}'
                text: >-
                  {{ range .Alerts }}
                    *Alert:* {{ .Annotations.summary }}
                    *Description:* {{ .Annotations.description }}
                    *Severity:* {{ .Labels.severity }}
                    *Started:* {{ .StartsAt }}
                  {{ end }}
        EOF

        # Create Alert Rules
        cat > prometheus-config/alert_rules.yml <<EOF
        groups:
          - name: mwc-backend
            rules:
              - alert: HighMemoryUsage
                expr: process_resident_memory_bytes / 1024 / 1024 > 500
                for: 5m
                labels:
                  severity: warning
                annotations:
                  summary: High memory usage detected
                  description: "Memory usage is above 500MB for 5 minutes"

              - alert: HighCPUUsage
                expr: process_cpu_seconds_total > 10
                for: 5m
                labels:
                  severity: warning
                annotations:
                  summary: High CPU usage detected
                  description: "CPU usage is high for 5 minutes"

              - alert: ServiceDown
                expr: up == 0
                for: 1m
                labels:
                  severity: critical
                annotations:
                  summary: Service is down
                  description: "Service has been down for more than 1 minute"
        EOF

    - name: 📋 Step 5 - Prepare Prometheus ECS Task Definition Template
      run: |
        sed -i "s/ACCOUNT_ID/${{ steps.get-aws-account.outputs.aws_account_id }}/g" prometheus-task-definition.json
        sed -i "s/EFS_FILESYSTEM_ID_PLACEHOLDER/${{ secrets.EFS_FILESYSTEM_ID }}/g" prometheus-task-definition.json

    - name: 📝 Step 6 - Register Prometheus Task Definition Revision with ECS
      id: register-prometheus-task
      run: |
        NEW_TASK_DEF=$(aws ecs register-task-definition --cli-input-json file://prometheus-task-definition.json)
        NEW_REVISION=$(echo $NEW_TASK_DEF | jq -r '.taskDefinition.revision')
        echo "revision=$NEW_REVISION" >> $GITHUB_OUTPUT

    - name: 🚀 Step 7 - Deploy Prometheus and AlertManager Service to ECS Cluster
      run: |
        if aws ecs describe-services --cluster ${{ env.ECS_CLUSTER }} --services ${{ env.ECS_PROMETHEUS_SERVICE }} 2>/dev/null | grep -q "ACTIVE\|RUNNING"; then
          echo "Updating existing Prometheus service..."
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service ${{ env.ECS_PROMETHEUS_SERVICE }} \
            --task-definition ${{ env.ECS_PROMETHEUS_TASK_DEFINITION }}:${{ steps.register-prometheus-task.outputs.revision }} \
            --force-new-deployment
        else
          echo "Creating new Prometheus service..."
          aws ecs create-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service-name ${{ env.ECS_PROMETHEUS_SERVICE }} \
            --task-definition ${{ env.ECS_PROMETHEUS_TASK_DEFINITION }}:${{ steps.register-prometheus-task.outputs.revision }} \
            --desired-count 1 \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[${{ secrets.ECS_SUBNET_IDS }}],securityGroups=[${{ secrets.ECS_SECURITY_GROUP_ID }}],assignPublicIp=ENABLED}"
        fi

    - name: ⏳ Step 8 - Wait for Prometheus Service Deployment to Stabilize
      run: |
        aws ecs wait services-stable \
          --cluster ${{ env.ECS_CLUSTER }} \
          --services ${{ env.ECS_PROMETHEUS_SERVICE }}

  slack-notification-prometheus-success:
    name: Prometheus ECS Deployment Success
    runs-on: ubuntu-latest
    needs: deploy-prometheus
    if: success()
    steps:
    - name: Notify Slack Prometheus Success
      uses: rtCamp/action-slack-notify@v2
      env:
        SLACK_CHANNEL: monitoring
        SLACK_COLOR: good
        SLACK_ICON: https://github.com/rtCamp.png?size=48
        SLACK_MESSAGE: |
          📊 Prometheus and AlertManager deployed to ECS in ${{ env.ENVIRONMENT }} environment
          *Cluster:* ${{ env.ECS_CLUSTER }}
          *Service:* ${{ env.ECS_PROMETHEUS_SERVICE }}
          *Task Definition:* ${{ env.ECS_PROMETHEUS_TASK_DEFINITION }}:${{ steps.register-prometheus-task.outputs.revision }}
          *Prometheus:* Available on port 9090
          *AlertManager:* Available on port 9093
        SLACK_TITLE: Prometheus ECS Deployment Success
        SLACK_USERNAME: GitHub Actions
        SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}