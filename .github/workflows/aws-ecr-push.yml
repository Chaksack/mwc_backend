name: Build and Push to AWS ECR

on:
  push:
    branches: [ staging ]
  pull_request:
    branches: [ staging ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'prod'
        type: choice
        options:
          - dev
          - staging
          - prod

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: ${{ secrets.ECR || 'mwc-backend' }}
  IMAGE_TAG: latest
  SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}

jobs:
  # Code Quality Analysis with SonarCloud
  code-quality:
    name: Code Quality (SonarCloud)
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Checkout Source Code with Full History
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Shallow clones should be disabled for better relevancy of analysis

    - name: ⚙️ Setup Go Development Environment
      uses: actions/setup-go@v4
      with:
        go-version: '1.23'

    - name: 🧪 Execute Tests with Coverage Analysis
      run: |
        go mod tidy
        go test ./... -coverprofile=coverage.out

    - name: 📊 Run SonarCloud Code Quality Scan
      uses: SonarSource/sonarcloud-github-action@master
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Needed to get PR information, if any
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      with:
        args: >
          -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }}
          -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }}
          -Dsonar.sources=.
          -Dsonar.go.coverage.reportPaths=coverage.out
          -Dsonar.exclusions=**/*_test.go,**/vendor/**,**/testdata/**

    - name: ✅ Verify SonarCloud Quality Gate Status
      uses: SonarSource/sonarqube-quality-gate-action@master
      timeout-minutes: 5
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # Slack notification for code quality success
  slack-notification-quality-success:
    name: Code Quality Success
    runs-on: ubuntu-latest
    needs: code-quality
    if: success()
    steps:
    - name: Notify Slack - Code Quality Success
      uses: rtCamp/action-slack-notify@v2
      env:
        SLACK_CHANNEL: code-quality
        SLACK_COLOR: good
        SLACK_ICON: https://github.com/rtCamp.png?size=48
        SLACK_MESSAGE: |
          ✅ Code quality analysis passed for ${{ github.repository }}
          *Branch:* ${{ github.ref_name }}
          *Commit:* ${{ github.sha }}
          *Pushed by:* ${{ github.actor }}
          *Check the [SonarCloud Dashboard](https://sonarcloud.io/project/overview?id=${{ secrets.SONAR_PROJECT_KEY }}) for more details*
        SLACK_TITLE: Code Quality Analysis Success
        SLACK_USERNAME: GitHub Actions
        SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}

  # Slack notification for code quality failure
  slack-notification-quality-failure:
    name: Code Quality Failure
    runs-on: ubuntu-latest
    needs: code-quality
    if: failure()
    steps:
    - name: Notify Slack - Code Quality Failure
      uses: rtCamp/action-slack-notify@v2
      env:
        SLACK_CHANNEL: code-quality
        SLACK_COLOR: danger
        SLACK_ICON: https://github.com/rtCamp.png?size=48
        SLACK_MESSAGE: |
          ❌ Code quality analysis failed for ${{ github.repository }}
          *Branch:* ${{ github.ref_name }}
          *Commit:* ${{ github.sha }}
          *Pushed by:* ${{ github.actor }}
          *Check the [SonarCloud Dashboard](https://sonarcloud.io/project/overview?id=${{ secrets.SONAR_PROJECT_KEY }}) and [GitHub Actions logs](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) for more details*
        SLACK_TITLE: Code Quality Analysis Failure
        SLACK_USERNAME: GitHub Actions
        SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}

  build-and-push:
    name: Build and Push to ECR
    runs-on: ubuntu-latest
    needs: code-quality  # Only build if code quality passes
    if: github.event_name != 'pull_request'  # Don't build on PRs

    # Set environment based on trigger
    env:
      ENVIRONMENT: ${{ github.event.inputs.environment || 'dev' }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # Set up Docker Buildx for faster builds with caching
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Create ECR repository if it doesn't exist
      run: |
        # Check if repository exists
        if ! aws ecr describe-repositories --repository-names ${{ env.ECR_REPOSITORY }} 2>/dev/null; then
          echo "Repository ${{ env.ECR_REPOSITORY }} does not exist. Creating it..."
          aws ecr create-repository --repository-name ${{ env.ECR_REPOSITORY }}
        else
          echo "Repository ${{ env.ECR_REPOSITORY }} already exists."
        fi

    # Cache Docker layers to speed up builds
    - name: Cache Docker layers
      uses: actions/cache@v4
      with:
        path: /tmp/.buildx-cache
        key: ${{ runner.os }}-buildx-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-buildx-

    # Log environment information
    - name: Log environment information
      run: |
        echo "Preparing to build for ${{ env.ENVIRONMENT }} environment"
        echo "Using environment-specific configuration from GitHub Secrets"

    - name: Build and tag image for Amazon ECR
      id: build-image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
      run: |
        # Set environment-specific tag
        ENV_TAG=${{ env.ENVIRONMENT }}

        echo "Building Docker image for $ENV_TAG environment..."

        # Build the Docker image with caching and environment-specific args
        docker buildx build \
          --cache-from=type=local,src=/tmp/.buildx-cache \
          --cache-to=type=local,dest=/tmp/.buildx-cache-new \
          --build-arg DATABASE_URL=${{ secrets.DATABASE_URL }} \
          --build-arg RABBITMQ_URL=${{ secrets.RABBITMQ_URL }} \
          --build-arg RABBITMQ_USE_TLS=true \
          --build-arg JWT_SECRET=${{ secrets.JWT_SECRET }} \
          --build-arg SMTP_HOST=${{ secrets.SMTP_HOST }} \
          --build-arg SMTP_PORT=${{ secrets.SMTP_PORT }} \
          --build-arg SMTP_USER=${{ secrets.SMTP_USER }} \
          --build-arg SMTP_PASSWORD=${{ secrets.SMTP_PASSWORD }} \
          --build-arg EMAIL_FROM="${{ secrets.EMAIL_FROM }}" \
          --build-arg STRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY }} \
          --build-arg STRIPE_PUBLISHABLE_KEY=${{ secrets.STRIPE_PUBLISHABLE_KEY }} \
          --build-arg STRIPE_WEBHOOK_SECRET=${{ secrets.STRIPE_WEBHOOK_SECRET }} \
          --build-arg STRIPE_MONTHLY_PRICE_ID=${{ secrets.STRIPE_MONTHLY_PRICE_ID }} \
          --build-arg STRIPE_ANNUAL_PRICE_ID=${{ secrets.STRIPE_ANNUAL_PRICE_ID }} \
          --tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
          --tag $ECR_REGISTRY/$ECR_REPOSITORY:latest \
          --tag $ECR_REGISTRY/$ECR_REPOSITORY:$ENV_TAG \
          --push \
          --file Dockerfile \
          .

        # Output the image URI for use in subsequent steps or jobs
        echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$ENV_TAG" >> $GITHUB_OUTPUT

        echo "Successfully pushed image to ECR with tags: $IMAGE_TAG, latest, and $ENV_TAG"

        # Clean up cache
        rm -rf /tmp/.buildx-cache
        mv /tmp/.buildx-cache-new /tmp/.buildx-cache

    outputs:
      image: ${{ steps.build-image.outputs.image }}
      environment: ${{ env.ENVIRONMENT }}

  send-deployment-notification:
    name: Send Deployment Notification
    runs-on: ubuntu-latest
    needs: build-and-push
    env:
      ENVIRONMENT: ${{ needs.build-and-push.outputs.environment }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Deployment Summary
        run: |
          echo "✅ Deployment Summary"
          echo "Environment: ${{ env.ENVIRONMENT }}"
          echo "Image: ${{ needs.build-and-push.outputs.image }}"
          echo "Commit: ${{ github.sha }}"
          echo "Pushed by: ${{ github.actor }}"

      # Send Slack notification for successful deployment
      - name: Send Slack notification - Success
        if: success()
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_CHANNEL: deployments
          SLACK_COLOR: good
          SLACK_ICON: https://github.com/rtCamp.png?size=48
          SLACK_MESSAGE: |
            ✅ Successfully built and pushed to ECR for ${{ env.ENVIRONMENT }} environment
            *Image:* ${{ needs.build-and-push.outputs.image }}
            *Repository:* ${{ github.repository }}
            *Branch:* ${{ github.ref_name }}
            *Commit:* ${{ github.sha }}
            *Pushed by:* ${{ github.actor }}
          SLACK_TITLE: Docker Build & Push Success
          SLACK_USERNAME: GitHub Actions
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}

      # Send Slack notification for failed deployment
      - name: Send Slack notification - Failure
        if: failure()
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_CHANNEL: deployments
          SLACK_COLOR: danger
          SLACK_ICON: https://github.com/rtCamp.png?size=48
          SLACK_MESSAGE: |
            ❌ Failed to build and push to ECR for ${{ env.ENVIRONMENT }} environment
            *Repository:* ${{ github.repository }}
            *Branch:* ${{ github.ref_name }}
            *Commit:* ${{ github.sha }}
            *Workflow:* ${{ github.workflow }}
            *Pushed by:* ${{ github.actor }}
            *Check the [GitHub Actions logs](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) for more details*
          SLACK_TITLE: Docker Build & Push Failure
          SLACK_USERNAME: GitHub Actions
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}